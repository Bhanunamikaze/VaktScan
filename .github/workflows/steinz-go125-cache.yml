name: Steinz Go 1.25 cache bridge

on:
  push:
    branches:
      - agent/steinz-go125-cache-20260802
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-toolchain-and-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.0'
          cache: false
      - name: Download public SteinzDAST module graph
        run: |
          set -euo pipefail
          mkdir -p /tmp/steinz-module-cache
          cat > /tmp/steinz-module-cache/go.mod <<'EOF'
          module github.com/yourorg/quarry-cache-bridge

          go 1.25.0

          require (
            github.com/charmbracelet/bubbletea v1.3.10
            github.com/charmbracelet/lipgloss v1.1.0
            github.com/go-rod/rod v0.116.2
            github.com/jackc/pgx/v5 v5.10.0
            github.com/projectdiscovery/wappalyzergo v0.2.79
            golang.org/x/crypto v0.54.0
            golang.org/x/net v0.56.0
            golang.org/x/sys v0.47.0
            gopkg.in/yaml.v3 v3.0.1
            modernc.org/sqlite v1.49.1
          )
          EOF
          cd /tmp/steinz-module-cache
          go mod download all
          go version
          go env GOROOT GOPATH GOMODCACHE
      - name: Archive exact toolchain and module cache
        run: |
          set -euo pipefail
          goroot=$(go env GOROOT)
          gopath=$(go env GOPATH)
          tar -C "$(dirname "$goroot")" -czf /tmp/steinz-go125-toolchain.tar.gz "$(basename "$goroot")"
          tar -C "$gopath" -czf /tmp/steinz-go125-gomodcache.tar.gz pkg/mod
          sha256sum /tmp/steinz-go125-toolchain.tar.gz /tmp/steinz-go125-gomodcache.tar.gz | tee /tmp/SHA256SUMS
          ls -lh /tmp/steinz-go125-toolchain.tar.gz /tmp/steinz-go125-gomodcache.tar.gz
      - name: Upload bridge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steinz-go125-cache-${{ github.run_id }}
          path: |
            /tmp/steinz-go125-toolchain.tar.gz
            /tmp/steinz-go125-gomodcache.tar.gz
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
